<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FinWise · 企业总览</title>
  <link rel="stylesheet" href="operator-navigation.css?v=navigation-2">
  <link rel="stylesheet" href="portfolio.css?v=progress-1">
  <script src="portfolio.js?v=progress-1" defer></script>
</head>
<body>
  <header class="topbar"><div class="brand"><span class="mark">F</span>FinWise <span class="muted small">企业总览</span></div><span id="authState" class="small muted">正在读取授权范围…</span></header>
  <div class="layout">
    <aside class="sidebar" aria-label="导航">
      <nav id="globalNav" class="global-nav" aria-label="主导航">
        <a class="nav-item" href="operator.html"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M10 10v10"/></svg></span><span>工作台</span></a>
        <a class="nav-item" href="portfolio.html" aria-current="page"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 20V4h10v16M14 9h6v11M8 8h2M8 12h2M8 16h2M2 20h20"/></svg></span><span>企业总览</span></a>
        <a class="nav-item" href="operator.html#settings"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="currentColor" stroke="none"/><circle cx="15" cy="17" r="3" fill="currentColor" stroke="none"/></svg></span><span>设置</span></a>
      </nav>
      <p class="side-note">在右侧选择企业，进入工作台办理本期业务。</p>
    </aside>
    <main class="main">
      <header class="page-heading"><div><h1>企业总览</h1><p class="muted">查看各企业的进度和待办，点击企业进入工作台。</p></div><button id="refresh" class="button" type="button">刷新状态</button></header>
      <div id="notice" class="notice hidden" role="status" aria-live="polite"></div>
      <form id="loginForm" class="login-box hidden"><h2>登录后查看企业</h2><label>用户名<input id="username" autocomplete="username" required></label><label>密码<input id="password" type="password" autocomplete="current-password" required></label><button class="button primary" type="submit">登录</button></form>
      <section id="overview" aria-label="企业办理进度">
        <div class="toolbar"><label class="search-field">搜索企业或账套<input id="search" type="search" placeholder="企业名称、执照编号、账套" autocomplete="off"></label><label>查看期间<select id="periodFilter"><option value="latest">各账套最近期间</option><option value="all">全部期间</option></select></label></div>
        <nav id="filters" class="filters" aria-label="按办理状态筛选"><button type="button" data-filter="all" aria-pressed="true">全部</button><button type="button" data-filter="attention" aria-pressed="false">需处理</button><button type="button" data-filter="processing" aria-pressed="false">处理中</button></nav>
        <div class="list-meta"><p id="listCount" class="small muted">正在读取…</p><p id="updatedAt" class="small muted" role="status"></p></div>
        <div class="table-wrap" tabindex="0" role="region" aria-label="企业进度与待办，可横向滚动"><table><thead><tr><th>企业 / 账套</th><th>期间</th><th>处理状态</th><th>当前进度</th><th>待办与复核</th><th>操作</th></tr></thead><tbody id="companies"><tr><td colspan="6" class="empty">正在读取授权企业…</td></tr></tbody></table></div>
        <p class="small muted scope-note">默认展示各账套最近期间，可切换查看历史月份。进度和待办来自工作台同一份处理结果；复核完成不代表正式过账。</p>
      </section>
    </main>
  </div>
</body>
</html>
