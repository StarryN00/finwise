<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FinWise · 期间工作台</title>
  <link rel="stylesheet" href="operator.css?v=one-entry-1">
  <link rel="stylesheet" href="operator-navigation.css?v=navigation-2">
  <script src="operator-historical.js?v=guided-decision-2" defer></script>
  <script src="operator-materials.js?v=verify-bulk-2" defer></script>
  <script src="operator-material-agent.js?v=agent-loop-1" defer></script>
  <script src="operator-problem-review.js?v=triage-1" defer></script>
  <script src="operator-material-navigation.js?v=verify-bulk-2" defer></script>
  <script src="operator-bank-periods.js?v=bank-period-1" defer></script>
  <script src="operator-material-guidance.js?v=triage-1" defer></script>
  <script src="operator-decision.js?v=verify-bulk-2" defer></script>
  <script src="operator-bills.js?v=guided-decision-2" defer></script>
  <script src="operator-invoice-review.js?v=guided-decision-2" defer></script>
  <script src="operator-accounts.js?v=guided-decision-2" defer></script>
  <script src="operator-mapping.js?v=guided-decision-2" defer></script>
  <script src="operator-parse-plans.js?v=structure-plan-1" defer></script>
  <script src="operator-profile-cards.js?v=profile-cards-1" defer></script>
  <script src="operator-new-scope.js?v=new-scope-1" defer></script>
  <script src="operator-voucher-proposals.js?v=voucher-proposals-1" defer></script>
  <script src="operator-autonomous.js?v=one-entry-1" defer></script>
  <script src="operator.js?v=one-entry-1" defer></script>
</head>
<body>
  <header class="topbar"><div class="brand"><span class="mark">F</span> FinWise <span class="muted small">期间工作台</span></div><div class="actions"><span id="authState" class="muted small">需要登录</span><button id="logout" class="text hidden">退出</button></div></header>
  <div class="layout">
    <aside id="sidebar" class="sidebar" aria-label="登录或企业与期间">
      <form id="loginForm" class="login"><h2>登录工作台</h2><p class="small muted">请输入用户名和密码。</p><label>用户名<input id="username" autocomplete="username" required></label><label>密码<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">登录</button></form>
      <nav id="globalNav" class="global-nav hidden" aria-label="主导航">
        <button class="nav-item" data-action="workbench" aria-current="page"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M10 10v10"/></svg></span><span>工作台</span></button>
        <a class="nav-item" href="portfolio.html"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 20V4h10v16M14 9h6v11M8 8h2M8 12h2M8 16h2M2 20h20"/></svg></span><span>企业总览</span></a>
        <button class="nav-item" data-action="settings"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="currentColor" stroke="none"/><circle cx="15" cy="17" r="3" fill="currentColor" stroke="none"/></svg></span><span>设置</span></button>
      </nav>
      <section id="scopeChooser" class="hidden" aria-label="处理范围"><div class="row sidebar-section-head"><h2>企业与期间</h2><div class="row"><button id="newScope" class="text" data-action="new-scope">新建企业</button><button id="closeSidebar" class="text mobile-only" aria-label="关闭企业列表">关闭</button></div></div><label class="sr-only" for="search">搜索企业、执照编号、账套或期间</label><input id="search" type="search" placeholder="搜索企业、账套或期间"><div id="scopeList" class="scope-list"></div><p class="side-note">仅显示当前账号有权访问的企业与期间。</p></section>
    </aside>
    <button id="scrim" class="scrim hidden" aria-label="关闭企业列表" tabindex="-1"></button>
    <main id="main" class="main">
      <div id="notice" role="status" aria-live="polite" class="notice hidden"></div>
      <button id="openSidebar" class="secondary mobile-only" aria-controls="sidebar" aria-expanded="false">菜单与企业</button>
      <div id="workspace"><div class="empty">请先登录工作台。</div></div>
    </main>
  </div>
  <dialog id="dialog" aria-labelledby="dialogTitle"><div class="dialog-head"><h2 id="dialogTitle">详情</h2><button id="closeDialog" class="secondary" aria-label="关闭详情">关闭</button></div><div id="dialogBody"></div></dialog>
  <input id="baselineFile" class="hidden" type="file" accept=".xls,.xlsx">
</body>
</html>
