 $('alertBanner').innerHTML=target&&!state.alertDismissed?'<div class="alert-banner" role="status"><span class="grow"><strong>'+target.short+'</strong> 新增 1 组阻断 · 疑似重复流水</span>'+textButton('company','查看企业','data-id="'+target.id+'"')+'<button class="icon-button" data-action="dismiss-alert" aria-label="关闭新异常提醒">×</button></div>':'';
}
function renderProgress(c,d) {
 const viewed=viewedStage(c,d);
 return '<section class="panel progress-panel" aria-label="整体进度"><div class="progress-top">'+
 '<div><div class="overall-value number"><strong id="overallPercent">'+d.percent+'</strong><span>%</span></div><p class="progress-copy">整体阶段完成度</p></div>'+
 '<div class="grow"><strong title="按实际完成阶段数计算，不代表耗时比例">已完成 '+d.completed+' / 5 阶段</strong>'+bar(d.percent,'overall-track','整体阶段完成度')+'</div>'+ 
 '<div class="outcomes"><div><strong class="number">'+d.files.length+'</strong><span>份资料</span></div>'+(d.delivered?'<div><strong class="number">'+d.delivered+'</strong><span>张已交付</span></div>':'')+
 '<div><strong class="number '+(d.blockers?'bad':'')+'">'+d.blockers+'</strong><span>组阻断</span></div></div></div>'+
 '<button class="mobile-stage-toggle" data-action="toggle-stages" aria-expanded="'+state.mobileStages+'"><span>'+(viewed===d.active?'当前步骤':'正在查看')+' '+(viewed+1)+' / 5 · '+STAGES[viewed]+'</span><span>阶段总览 '+(state.mobileStages?'−':'＋')+'</span></button>'+
 '<nav class="stages'+(state.mobileStages?' expanded':'')+'" aria-label="五阶段进度">'+d.stages.map((s,i)=>
 '<button class="stage '+s.status+(i===viewed?' active':'')+'" data-action="stage" data-stage="'+i+'" aria-pressed="'+(i===viewed)+'" aria-controls="stageWorkspace"'+(i===d.active?' aria-current="step"':'')+(canViewStage(d,i)?'':' disabled title="尚未开始，暂无成果可查看"')+'>'+
 '<span class="stage-top"><span class="step-number">'+(s.complete?'✓':i+1)+'</span>'+STAGES[i]+'</span>'+
 '<div class="stage-state">'+labels[s.status]+(i===d.active?' · 当前办理':i===viewed?' · 查看中':'')+'</div>'+
 '<div class="stage-count">'+(s.percent===null?(s.done?(i===3?'已复核 ':'已交付 ')+s.done+' '+s.unit+' · 总量待定':'待统计'):'<span class="stage-percent number">'+s.percent+'%</span> · '+s.done+'/'+s.total+' '+s.unit)+'</div>'+ 
 (s.percent===null?'':bar(s.percent,'mini-track',STAGES[i]+'进度'))+'</button>').join('')+'</nav></section>';
}
function renderFacts(c,t) {
 const jx=c.id==='juxianda';
 const values=jx?[['发票价税合计',money(1757000)],['已匹配付款',money(873200)],['未解释差额',money(883800)]]:[['涉及金额',money(t.amount)],['核实范围','当前事项'],['来源','本期资料']];
 return '<dl class="facts">'+values.map(([k,v],i)=>'<div class="fact"><dt>'+k+'</dt><dd class="'+(v.startsWith('¥')?'money':'text-value')+(jx&&i===2?' bad':'')+'">'+v+'</dd></div>').join('')+'</dl>';
}
function renderTaskQueue(c,d) {
 const r=runtime(c);
 const others=d.tasks.filter(t=>!d.selected || t.id!==d.selected.id);
 return others.length?'<div class="task-queue">'+others.map(t=>{
  const record=r.records[t.id];
  if (record) return '<details class="queue-row"><summary><span>✓ '+escapeHtml(t.title)+'</span>'+badge('complete','已记录')+'</summary><p>'+escapeHtml(record.note || '未填写备注')+'<br>'+escapeHtml(record.at)+'</p></details>';
  return '<div class="queue-row flex spread"><button data-action="resume-task" data-id="'+t.id+'">'+escapeHtml(t.title)+'</button>'+badge('waiting',r.deferred.includes(t.id)?'已暂缓':'待核实')+'</div>';
 }).join('')+'</div>':'';
}
function renderTask(c,d) {
 const r=runtime(c);
 const heading='<header class="task-heading"><div><p class="eyebrow">当前任务 · 第 '+(d.active+1)+' 步</p><h2>'+STAGES[d.active]+'</h2></div>'+
 (d.tasks.length?'<div class="task-progress"><div class="flex spread"><span>已核实</span><strong class="number">'+d.recorded+'<span> / '+d.tasks.length+'</span></strong></div>'+bar(Math.round(d.recorded/d.tasks.length*100),'mini-track','人工核实进度')+'</div>':badge(d.status,d.blockers?'等待补证':d.archived?'已归档':labels[d.status]))+'</header>';
 let body='',actions='';
 if (d.selected) {
  const t=d.selected;
  body='<div class="task-position">第 '+(d.tasks.findIndex(x=>x.id===t.id)+1)+' 项 / 共 '+d.tasks.length+' 项</div><div class="task-title-row"><h3 tabindex="-1" id="currentTaskTitle">'+escapeHtml(t.title)+'</h3>'+badge(d.blockers?'blocked':'waiting',d.blockers?'证据阻断':'待核实')+'</div>'+renderFacts(c,t)+
   '<div class="issue-line"><span class="field-label">问题</span><p class="'+(d.blockers?'problem':'')+'">'+escapeHtml(t.reason)+'</p></div>'+
   '<div class="goal-line"><span class="field-label">本项目标</span><p>'+escapeHtml(t.goal)+'</p></div>'+
   '<div class="source-line">来源：'+escapeHtml(t.source)+' '+textButton('source','查看定位','data-task="'+t.id+'"')+'</div>'+
   '<div class="checks">'+t.checks.map(([k,v])=>'<span class="check-item '+(v==='通过'?'good':v==='已暂停'?'muted':'bad')+'">'+(v==='通过'?'✓':'!')+' '+k+' · '+v+'</span>').join('')+'</div>'+
   '<p class="suggestion">建议：对照来源资料与客户核实，补充核实依据或待补资料说明。</p>'+
   '<label class="note-field" for="confirmationNote">核实备注 <span>（选填）</span><textarea id="confirmationNote" data-task="'+t.id+'" placeholder="例如：客户确认分期付款，等待补充付款计划" rows="2">'+escapeHtml(r.draftNotes[t.id] || '')+'</textarea></label>';
  actions=button('confirm','确认已与客户核实',true,'data-id="'+t.id+'"')+textButton('defer','暂不处理','data-id="'+t.id+'"')+'<span class="hint">仅记录核实结果，不解除证据阻断</span>';
 } else if (d.pending.length) {
  body='<h3>还有 '+d.pending.length+' 项暂缓事项</h3><p class="muted" style="margin-top:10px">暂缓事项未计入完成数，可以继续核实。</p>';
  actions=button('resume','继续处理暂缓事项',true);
 } else if (d.blockers) {
  body='<h3>'+(d.delivered?'已交付 '+d.delivered+' 张凭证，剩余 '+d.blockers+' 组待补证':'核实已记录，等待补齐证据')+'</h3>'+
   '<div class="issue-line"><span class="field-label">问题</span><p class="problem">'+escapeHtml(c.blockedReason || (c.id==='juxianda'?'采购合同、入库证据仍缺失，付款差额 8,838.00 元尚未解释。':'疑似重复流水尚未完成证据校验，分析保持暂停。'))+'</p></div>'+
   '<div class="goal-line"><span class="field-label">下一步</span><p>向客户收集'+escapeHtml((c.missing || ['正确的交易流水及重复记录说明']).join('、'))+'。</p></div>'+
   '<div class="goal-line"><span class="field-label">完成条件</span><p>补充资料与业务对象关联，并通过确定性校验；现有核实记录继续保留。</p></div>'+
   (d.delivered?'<div class="status-note">已交付部分与异常业务分开保留，本期尚未完整归档。</div>':'');
  actions=button('supplement','查看补证清单',true);
 } else if (d.active===0) {
  body='<h3>'+(c.id==='xinqiyuan'?'新企业已建立，等待上传资料':'添加本期财务资料')+'</h3><p class="muted" style="margin-top:10px">本期尚未接收资料。准备以下文件后，即可开始分析。</p>'+
   '<ul class="simple-list">'+['银行流水','进项及销项发票','费用及往来明细'].map(s=>'<li class="flex spread"><span>'+s+'</span>'+badge('waiting','待接收')+'</li>').join('')+'</ul>'+
   '<div class="goal-line"><span class="field-label">本步目标</span><p>接收本批资料并确认所属期间，建立可分析的资料包。</p></div>';
  actions=button('upload-dialog','添加资料',true)+'<span class="hint">仅接收内置样例，不上传真实文件</span>';
 } else if (d.active===1) {
  const s=d.stages[1];
  body='<h3>正在分析本期资料</h3><div class="facts"><div class="fact"><dt>已分析</dt><dd class="number">'+s.done+' / '+s.total+' '+s.unit+'</dd></div><div class="fact"><dt>分析进度</dt><dd class="number">'+s.percent+'%</dd></div></div>'+
   '<div class="goal-line"><span class="field-label">当前动作</span><p>识别资料内容，建立发票、付款与业务对象的关联。</p></div>'+
   '<div class="goal-line"><span class="field-label">本步目标</span><p>完成本批分析并列出需要人工核实的事项；当前无需人工确认。</p></div>';
  actions=button('processing-details','查看处理详情',true)+'<span class="hint">使用“演示控制”推进模拟分析</span>';
 } else if (d.active===2) {
  body='<h3>核实记录齐备，可以执行校验</h3><div class="goal-line"><span class="field-label">本步目标</span><p>检查金额、期间、业务重复及来源关联。校验通过后，才能生成候选凭证。</p></div><p class="suggestion">这是本地模拟校验，不修改原始证据或正式账务数据。</p>';
  actions=button('validate','运行演示校验',true);
 } else if (d.active===3) {
  if (!d.count) {
   body='<h3>校验通过，准备生成凭证草稿</h3><div class="goal-line"><span class="field-label">本步目标</span><p>生成候选分录后逐张复核，草稿不计入正式账务余额。</p></div>';
   actions=button('generate','生成演示草稿',true);
  } else {
   const v=currentVouchers(c).find(v=>!v.reviewed);
   body='<div class="task-title-row"><h3>复核 '+v.number+'</h3><span class="small muted">已复核 '+d.reviewed+' / '+d.count+' 张</span></div>'+voucherDetail(v)+
    (v.auxRequired?'<div class="status-note"><label><input type="checkbox" id="auxConfirmed"> 已与客户核实供应商辅助核算信息（演示）</label></div>':'')+
    '<div class="goal-line"><span class="field-label">本步目标</span><p>核对摘要、科目、借贷金额及来源，确认凭证符合本期业务。</p></div>';
   actions=button('review','确认凭证复核',true,'data-id="'+v.id+'"'+(v.auxRequired?' disabled':''))+textButton('all-vouchers','查看全部凭证');
  }
 } else if (!d.archived) {
  body='<h3>'+d.count+' 张凭证已复核，等待归档</h3><div class="goal-line"><span class="field-label">本步目标</span><p>保存本地演示凭证及来源清单，形成可追溯的归档记录。</p></div><p class="suggestion">不向外部财务软件回传，不代表实际导入、关账或锁账。</p>';
  actions=button('archive-current','完成演示归档',true);
 } else {
  body='<h3>本期演示归档完成</h3><p class="muted" style="margin-top:10px">'+d.count+' 张凭证及来源清单已保存在本地演示状态中。</p>';
  actions=button('open-archive','查看归档清单',true);
 }
 return '<section class="panel task-panel" aria-label="当前任务">'+heading+'<div class="task-body">'+body+renderTaskTools(c,d)+'</div>'+renderTaskQueue(c,d)+'<footer class="action-row">'+actions+'</footer></section>';
}
function voucherDetail(v) {
 const debit=v.lines.reduce((s,l)=>s+l.debit,0),credit=v.lines.reduce((s,l)=>s+l.credit,0);
 return '<p class="small muted" style="margin-top:10px">'+v.date+' · '+escapeHtml(v.summary)+'</p><div class="table-scroll"><table><thead><tr><th>会计科目</th><th class="right">借方金额</th><th class="right">贷方金额</th></tr></thead><tbody>'+
 v.lines.map(l=>'<tr><td>'+l.account+'</td><td class="money right">'+(l.debit?money(l.debit):'—')+'</td><td class="money right">'+(l.credit?money(l.credit):'—')+'</td></tr>').join('')+
 '<tr><td><strong>合计</strong></td><td class="money right">'+money(debit)+'</td><td class="money right">'+money(credit)+'</td></tr></tbody></table></div>'+
 '<p class="source-line">来源：'+escapeHtml(v.source)+'</p><div class="checks"><span class="'+(debit===credit?'good':'bad')+'">'+(debit===credit?'✓ 借贷平衡':'! 借贷不平衡')+'</span><span class="muted">分录为内置演示数据</span></div>';
}
function voucherTable(vouchers,action) {
 return '<div class="table-scroll"><table><thead><tr><th>凭证字号</th><th>日期</th><th>摘要</th><th class="right">金额</th><th>操作</th></tr></thead><tbody>'+vouchers.map(v=>'<tr><td>'+v.number+'</td><td class="number">'+v.date+'</td><td>'+escapeHtml(v.summary)+'</td><td class="money right">'+money(v.amount)+'</td><td><button class="table-button" data-action="'+action+'" data-id="'+v.id+'">查看分录</button></td></tr>').join('')+'</tbody></table></div>';
}
function renderFiles(c,d) {
 return '<p class="small muted">本批已接收 '+d.files.length+' 份 · 失败 0 份 · 作废 0 份</p>'+
 (d.files.length?'<ul class="simple-list">'+d.files.map(f=>'<li class="flex spread"><span>'+escapeHtml(f)+'</span>'+badge('complete','已接收')+'</li>').join('')+'</ul>':'<p class="muted">尚未接收本期资料。</p>');
}
function renderValidation(c,d) {
 return '<div class="flex spread"><h3>确定性校验</h3>'+badge(d.valid?'complete':d.blockers?'blocked':'waiting',d.valid?'通过':d.blockers?'存在阻断':'等待校验')+'</div><ul class="simple-list">'+
 ['金额与税额','期间归属','重复业务','科目及辅助核算','来源追溯'].map(label=>'<li class="flex spread"><span>'+label+'</span><span class="small muted">'+(d.valid?'已通过演示校验':d.blockers?'详见阻断事项':d.analyzed?'待执行完整校验':'等待资料分析')+'</span></li>').join('')+'</ul>';
}
function renderTaskTools(c,d) {
 let links='';
 if(d.active===1) links+=textButton('files-dialog','查看本批资料');
 if(d.active===2) links+=textButton('validation-dialog','查看校验结果');
 if(d.analyzed || d.stages[1].done>0) links+=textButton('objects-dialog','查看关联业务');
 if(d.active!==1) links+=textButton('processing-details','处理记录');
 return links?'<div class="related-tools" aria-label="相关查看">'+links+'</div>':'';
}
function renderObjects(c,d) {
 return '<p class="small muted">'+c.name+' · '+period+'</p><ul class="simple-list"><li>业务组：'+(d.groups || 0)+' 组</li><li>校验通过：'+d.passed+' 组</li><li>阻断：'+d.blockers+' 组</li></ul>'+
 (d.blockers?'<p class="status-note">'+escapeHtml(c.blockedReason || (c.missing || ['疑似重复流水的核实依据']).join('、'))+'</p>':'')+
 '<form class="query-form" id="queryForm"><input id="objectQuery" aria-label="查询本期业务对象" placeholder="查询本期阻断、付款或资料" value="'+escapeHtml(state.query)+'">'+button('query-submit','查询')+'</form>'+
 '<div id="queryResult" class="records" role="status"'+(state.queryResult?'':' hidden')+'>'+escapeHtml(state.queryResult || '')+'</div>';
}
function renderStageContent(c,d,index) {
 let body='';
 if(index===0) body=renderFiles(c,d);
 if(index===1) body='<p class="muted">已分析 '+d.stages[1].done+' / '+d.stages[1].total+' '+d.stages[1].unit+
  (d.analyzed?'，已形成 '+d.groups+' 个业务组。':'；当前分析尚未完成。')+'</p>'+
  '<ul class="simple-list">'+d.files.map(f=>'<li class="flex spread"><span>'+escapeHtml(f)+'</span>'+badge(d.analyzed?'complete':'running',d.analyzed?'已分析':'分析中')+'</li>').join('')+'</ul>';
 if(index===2) body=renderValidation(c,d)+renderTaskQueue(c,{...d,selected:null});
 if(index===3) body='<p class="small muted">本期已生成 '+d.count+' 张凭证 · 已复核 '+d.reviewed+' 张'+(d.blockers?' · 异常业务尚未全部生成凭证':'')+'</p>'+voucherTable(currentVouchers(c),'voucher-dialog');
 if(index===4) body='<h3>'+d.delivered+' 张凭证已交付</h3><p class="muted" style="margin-top:12px">'+
  (d.archived?'本期已完成本地演示归档。':'本期尚未完整归档，剩余 '+d.blockers+' 组异常业务仍需处理。')+'</p>'+
  '<div class="status-note">来源清单与凭证分录随交付记录保留；查看成果不会改变当前任务。</div>'+
  textButton('open-archive','查看交付凭证');
 const links=(index===1||index===2||index===3?textButton('objects-dialog','查看关联业务'):'')+textButton('processing-details','处理记录');
 return '<section class="panel stage-content" aria-label="'+STAGES[index]+'内容"><header class="flex spread"><div class="flex"><h2>'+STAGES[index]+'</h2>'+badge(d.stages[index].status)+'</div>'+
 textButton('return-step','返回当前步骤')+'</header><div class="stage-body">'+body+'</div><div class="related-tools" aria-label="相关查看">'+links+'</div></section>';
}
function renderHistory(c) {
 const periods=c.history || [];
 if (!periods.length) return '<section class="panel empty"><h2>暂无往期数据</h2><p>这是一家新建企业，尚无已完成期间。</p>'+textButton('back-current','返回本期办理')+'</section>';
 const chosen=periods.find(p=>p.period===state.historyPeriod);
 return '<section class="panel"><div class="flex spread"><h2>往期数据</h2><span class="small muted">只读 · 不改变本期任务</span></div><div class="table-scroll"><table><thead><tr><th>会计期间</th><th>资料状态</th><th>凭证</th><th class="right">凭证金额</th><th>操作</th></tr></thead><tbody>'+
 periods.map(p=>'<tr><td class="number">'+p.period+'</td><td>已归档</td><td>'+p.count+' 张</td><td class="money right">'+money(p.total)+'</td><td><button class="table-button" data-action="history-period" data-period="'+p.period+'">查看期间</button></td></tr>').join('')+'</tbody></table></div></section>'+
 (chosen?'<section class="panel"><div class="flex spread"><h3>'+chosen.period+' 期间归档摘要</h3>'+textButton('history-archive','查看归档凭证','data-period="'+chosen.period+'"')+'</div><p class="muted" style="margin-top:12px">'+chosen.count+' 张演示凭证 · 借贷合计各 '+money(chosen.total)+'</p><ul class="simple-list"><li>'+c.short+' '+chosen.period+' 资料包</li><li>凭证清单、来源定位及本地归档记录</li></ul><p class="small muted">历史数据为该企业独立的演示样例，原始记录只读。</p></section>':'');
}
function renderArchive(c) {
 const periods=archivePeriods(c);
 if (!periods.length) return '<section class="panel empty"><h2>暂无已归档凭证</h2><p>本期尚未归档，也没有往期归档记录。</p>'+textButton('back-current','返回本期办理')+'</section>';
 const p=periods.find(p=>p.period===state.historyPeriod) || periods[0];
 state.historyPeriod=p.period;
 const filters=archiveSearch[archiveSearchKey(c)] || {};
 return '<section class="panel"><div class="flex spread"><div><h2>已归档凭证</h2><p class="small muted">只读查看 · '+(p.complete?'本地演示归档':'部分交付，整期未归档')+'</p></div><label class="small">查看期间 <select id="archivePeriod" aria-label="归档凭证期间">'+periods.map(h=>'<option value="'+h.period+'"'+(h.period===p.period?' selected':'')+'>'+h.period+(h.complete?' · 已归档':' · 部分交付')+'</option>').join('')+'</select></label></div>'+
 '<div class="context-note" style="margin-top:16px">'+c.short+' · '+p.period+' · '+p.count+' 张凭证 · 借贷合计各 <span class="money">'+money(p.total)+'</span></div>'+
 '<form id="archiveSearchForm" class="flex"><label for="archiveQuery">查询凭证<input id="archiveQuery" type="search" placeholder="凭证字号、摘要、科目或来源资料" value="'+escapeHtml(filters.query || '')+'"></label>'+
 '<label class="date-filter" for="archiveStartDate">凭证开始日期<input id="archiveStartDate" type="date" aria-describedby="archiveSearchError" value="'+escapeHtml(filters.start || '')+'"></label>'+
 '<label class="date-filter" for="archiveEndDate">凭证结束日期<input id="archiveEndDate" type="date" value="'+escapeHtml(filters.end || '')+'"></label>'+
 '<div class="flex archive-search-actions"><button type="submit" class="button primary">查询</button>'+textButton('clear-archive-search','清除条件','type="button"')+'</div></form><p id="archiveSearchError" class="small bad" role="alert" hidden></p><div id="archiveResults">'+renderArchiveResults(c,p)+'</div></section>';
}
function renderAllVouchers(c) {
 const d=derive(c);
 return '<section class="panel" aria-labelledby="voucherListTitle"><div class="flex spread"><h2 id="voucherListTitle" tabindex="-1">本期全部凭证</h2>'+textButton('back-current','返回工作台')+'</div>'+
 '<p class="context-note" style="margin-top:16px">共 '+d.count+' 张 · 已复核 '+d.reviewed+' 张 · 待复核 '+Math.max(0,d.count-d.reviewed)+' 张</p>'+voucherTable(currentVouchers(c),'voucher-dialog')+'</section>';
}
function renderMain() {
 const c=currentCompany(),d=derive(c),viewed=viewedStage(c,d);
 $('main').innerHTML=state.tab==='history'?renderHistory(c):state.tab==='archive'?renderArchive(c):state.tab==='vouchers'?renderAllVouchers(c):
 renderProgress(c,d)+'<div id="stageWorkspace" role="region" aria-label="阶段工作区" data-stage="'+viewed+'">'+(viewed===d.active?renderTask(c,d):renderStageContent(c,d,viewed))+'</div>';
}
function render() { renderCompanies();renderContext(currentCompany());renderAlert();renderMain(); }
function openDialog(title,body,actions='',dialogClass='') {
 if (!$('dialog').open) dialogReturnFocus=document.activeElement;
 $('dialog').className=dialogClass;
 $('dialog').innerHTML='<header><h2 id="dialogTitle">'+title+'</h2><button class="icon-button" data-action="close-dialog" aria-label="关闭对话框">×</button></header>'+body+(actions?'<div class="dialog-actions">'+actions+'</div>':'');
 if (!$('dialog').open) $('dialog').showModal();
}
function closeDialog() { $('dialog').close(); }
function openVoucherDialog(c,p,v,status,statusText) {
 openDialog('凭证分录 · '+v.number,'<div class="flex spread"><p class="small muted">'+escapeHtml(c.name)+' · '+p+'</p>'+badge(status,statusText)+'</div>'+voucherDetail(v),'','voucher-dialog');
}
$('dialog').addEventListener('close',()=>{if(dialogReturnFocus && dialogReturnFocus.isConnected) dialogReturnFocus.focus({preventScroll:true});else $('mobileMenu').focus({preventScroll:true});});
function openMenu() {
 $('sidebar').classList.add('open');$('overlay').classList.add('show');$('mobileMenu').setAttribute('aria-expanded','true');
 $('shell').inert=true;$('sidebar').setAttribute('role','dialog');$('sidebar').setAttribute('aria-modal','true');
 $('companySearch').focus({preventScroll:true});
}
function closeMenu(restore=true) {
 const wasOpen=$('sidebar').classList.contains('open');
 $('sidebar').classList.remove('open');$('overlay').classList.remove('show');$('shell').inert=false;
 $('sidebar').removeAttribute('role');$('sidebar').removeAttribute('aria-modal');$('mobileMenu').setAttribute('aria-expanded','false');
 if(wasOpen && restore) $('mobileMenu').focus({preventScroll:true});
}
function selectCompany(id) {
 if (!companies.some(c=>c.id===id)) return;
 state.selectedId=id;state.tab='current';state.historyPeriod=null;state.query='';state.queryResult=null;state.mobileStages=false;
 const r=runtime(currentCompany());r.unread=false;r.view.stage=null;
 persist();closeMenu();render();
}
function tagDialog(c) {
 dialogCompany=c.id;
 openDialog(c.short+' · 企业标签','<p class="small muted">标签可用于搜索，增删后保存在本机。</p><div class="tags" style="margin:16px 0">'+c.tags.map(t=>'<button class="tag" data-action="delete-tag" data-tag="'+escapeHtml(t)+'" aria-label="删除标签 '+escapeHtml(t)+'">'+escapeHtml(t)+' ×</button>').join('')+'</div>'+
 '<form id="tagForm"><label for="newTag">新增标签</label><input id="newTag" maxlength="20" placeholder="例如：重点客户" value="'+escapeHtml(tagDraft)+'">'+button('add-tag','添加标签')+'</form>');
}
function addTag() {
 const c=companies.find(c=>c.id===dialogCompany),value=$('newTag').value.trim();
 if(!value){toast('请先填写标签名称');$('newTag').focus();return;}
 if(c.tags.includes(value)){toast('该标签已存在');return;}
 c.tags.push(value);tagDraft='';persist();renderCompanies();tagDialog(c);$('newTag').focus();toast('标签已添加');
}
function supplementDialog(c) {
 const missing=c.missing || ['正确的交易流水','疑似重复记录的核实依据'];
 openDialog('待补证清单','<p class="small muted">'+c.name+' · '+period+'</p><ul class="simple-list">'+missing.map(s=>'<li class="flex spread"><span>'+escapeHtml(s)+'</span>'+badge('blocked','待补充')+'</li>').join('')+'</ul><div class="status-note">人工核实记录已保留。必须补充来源证据并重新校验，才能解除阻断；本 Demo 不模拟一键放行。</div>');
}
function processingDialog(c) {
 const d=derive(c),r=runtime(c);
 openDialog('处理记录','<div class="context-note">'+STAGES[d.active]+' · '+(d.blockers?'等待补证，处理暂停':d.pending.length?'等待人工核实':d.active===1?'正在分析':'等待下一步操作')+'</div><ul class="simple-list">'+
 d.stages.map((s,i)=>'<li class="flex spread"><span>'+STAGES[i]+'</span>'+badge(s.status)+'</li>').join('')+'</ul>'+
 '<div class="records">'+escapeHtml(r.log.length?r.log.join('\n'):'本期演示范围已建立。所有操作仅记录在本机。')+'</div>');
}
function runQuery() {
 const c=currentCompany(),d=derive(c);
 state.query=$('objectQuery').value.trim();
 if(!state.query){toast('请输入要查询的问题');return;}
 const prefix=c.short+' · '+period+'：';
 if(/阻断|缺|补证/.test(state.query)) state.queryResult=prefix+(d.blockers?d.blockers+' 组阻断。缺口：'+(c.missing || ['疑似重复交易的核实依据']).join('、'):'当前未发现证据阻断。');
 else if(/资料|文件/.test(state.query)) state.queryResult=prefix+'有效资料 '+d.files.length+' 份。'+d.files.join('、');
 else if(/凭证|交付|归档/.test(state.query)) state.queryResult=prefix+'凭证 '+d.count+' 张，已复核 '+d.reviewed+' 张，已交付 '+d.delivered+' 张。';
 else if(/付款|差额/.test(state.query) && c.id==='juxianda') state.queryResult=prefix+'已匹配付款 8,732.00 元，发票 17,570.00 元，差额 8,838.00 元尚未解释。';
 else state.queryResult=prefix+'本地演示仅支持资料、阻断、凭证和已收录的付款问题，不会调用模型或补造答案。';
 $('queryResult').textContent=state.queryResult;$('queryResult').hidden=false;
}
document.addEventListener('click',event=>{
 const el=event.target.closest('[data-action]');
 if(!el || el.disabled) return;
 const action=el.dataset.action,c=currentCompany(),r=runtime(c),d=derive(c);
 event.preventDefault();
 if(action==='open-menu') return openMenu();
 if(action==='close-menu') return closeMenu();
 if(action==='close-dialog') return closeDialog();
 if(action==='company') return selectCompany(el.dataset.id);
 if(action==='clear-search' || action==='tag-search') {state.search=action==='clear-search'?'':el.dataset.tag;$('companySearch').value=state.search;renderCompanies();return;}
 if(action==='tags') {tagDraft='';return tagDialog(companies.find(x=>x.id===el.dataset.id));}
 if(action==='add-tag') return addTag();
 if(action==='delete-tag') {
  const company=companies.find(x=>x.id===dialogCompany);
  tagDraft=$('newTag').value;company.tags=company.tags.filter(t=>t!==el.dataset.tag);
  persist();renderCompanies();tagDialog(company);toast('标签已删除');return;
 }
 if(action==='simulate-alert') {
  const target=companies.find(x=>x.id==='luhai'),rr=runtime(target);
  if(rr.alert) {toast('陆海精密的演示阻断已存在');return;}
  rr.alert=true;rr.unread=true;rr.log.push('新增疑似重复流水，分析暂停。');state.alertDismissed=false;persist();
  renderCompanies();renderAlert();
  if(c.id===target.id) {r.view.stage=null;renderContext(c);renderMain();}
  toast('陆海精密新增阻断，当前企业不变');return;
 }
 if(action==='dismiss-alert') {state.alertDismissed=true;renderAlert();return;}
 if(action==='reset-dialog') return openDialog('重置演示办理记录','<p>将清除演示企业的核实备注、暂缓、上传、复核和归档记录。企业标签保留。</p>',button('close-dialog','取消')+button('reset','确认重置'));
 if(action==='reset') {
  for(const company of companies) runtimes[scopeKey(company)]=emptyRuntime();
  state.selectedId='juxianda';state.tab='current';state.historyPeriod=null;state.query='';state.queryResult=null;state.alertDismissed=false;state.search='';$('companySearch').value='';
  persist();closeDialog();closeMenu(false);render();toast('演示办理记录已重置，企业标签保留');return;
 }
 if(action==='tab' || action==='back-current' || action==='open-archive') {
  const fromVouchers=state.tab==='vouchers';
  state.tab=action==='tab'?el.dataset.tab:action==='back-current'?'current':'archive';
  state.historyPeriod=null;renderContext(c);renderMain();
  if(fromVouchers && state.tab==='current') {window.scrollTo(0,voucherReturnScroll);document.querySelector('[data-action="all-vouchers"]')?.focus({preventScroll:true});}
  return;
 }
 if(action==='toggle-stages') {state.mobileStages=!state.mobileStages;renderMain();return;}
 if(action==='stage' || action==='return-step') {
  if(chooseStage(c,action==='return-step'?d.active:Number(el.dataset.stage))) {state.mobileStages=false;renderMain();}
  return;
 }
 if(action==='all-vouchers') {
  voucherReturnScroll=window.scrollY;state.tab='vouchers';renderContext(c);renderMain();
  window.scrollTo(0,0);$('voucherListTitle').focus({preventScroll:true});return;
 }
 if(action==='files-dialog') return openDialog('本批资料',renderFiles(c,d));
 if(action==='validation-dialog') return openDialog('本期校验结果',renderValidation(c,d));
 if(action==='resume' || action==='resume-task') {
  if(action==='resume') r.deferred=[];
  else {r.deferred=r.deferred.filter(id=>id!==el.dataset.id);r.view.taskId=el.dataset.id;}
  persist();renderMain();return;
 }
 if(action==='confirm' || action==='review') {
  if(event.detail>1) return;
  const changed=action==='confirm'?recordTask(c,el.dataset.id):reviewVoucher(c,el.dataset.id);
  if(!changed) return;
  render();
  const title=$('currentTaskTitle');if(title) title.focus({preventScroll:true});
  toast(action==='confirm'?(derive(c).pending.length?'核实已记录，已进入下一项':derive(c).blockers?'核实记录已齐备，证据阻断仍保留':'核实已记录，下一步执行校验'):'凭证复核已记录');return;
 }
 if(action==='defer') {if(deferTask(c,el.dataset.id)){render();toast('事项已暂缓，未计入完成数');}return;}
 if(action==='supplement') return supplementDialog(c);
 if(action==='processing-details') return processingDialog(c);
 if(action==='source') {
  const t=d.tasks.find(t=>t.id===el.dataset.task);
  if(t) openDialog('来源定位','<p>'+escapeHtml(t.source)+'</p><div class="records">'+escapeHtml(t.reason)+'</div><p class="small muted" style="margin-top:12px">此处展示演示资料的定位信息，不读取或上传本机原始文件。</p>');
  return;
 }
 if(action==='objects-dialog') return openDialog('本期业务对象',renderObjects(c,d));
 if(action==='upload-dialog') return openDialog('添加本地演示资料','<p class="small muted">'+c.short+' · '+period+' · 不上传真实文件</p><ul class="simple-list">'+['银行流水.xlsx','进项发票.xlsx','销项发票.xlsx','费用明细.xlsx'].map(f=>'<li>✓ '+f+'</li>').join('')+'</ul>',button('close-dialog','取消')+button('upload','接收 4 份演示资料'));
 if(action==='simulate-analysis') {
  if(changeStep(c,'analysis')) {render();toast('本批演示分析已完成');}
  else toast(d.blockers?'当前仍有阻断，不能推进分析':!d.hasFiles?'请先接收本期资料':'当前没有待推进的分析');
  return;
 }
 const stepAction={upload:'upload',validate:'validate',generate:'generate','archive-current':'archive'}[action];
 if(stepAction) {
  if(changeStep(c,stepAction)) {if($('dialog').open) closeDialog();render();toast({upload:'已接收 4 份演示资料，进入资料分析',validate:'演示校验通过，可以生成草稿',generate:'已生成演示草稿，请逐张复核',archive:'本地演示归档完成，未写入外部系统'}[stepAction]);}
  return;
 }
 if(action==='voucher-dialog') {const v=currentVouchers(c).find(v=>v.id===el.dataset.id);if(v) openVoucherDialog(c,period,v,v.reviewed?'complete':'waiting',v.reviewed?'已复核':'待复核');return;}
 if(action==='history-period') {state.historyPeriod=el.dataset.period;renderMain();return;}
 if(action==='history-archive') {state.tab='archive';state.historyPeriod=el.dataset.period;renderContext(c);renderMain();return;}
 if(action==='archive-voucher') {
  const p=archivePeriods(c).find(p=>p.period===state.historyPeriod);
  const v=p && vouchersFor(c,p.period,p.count,p.total).find(v=>v.id===el.dataset.id);
  if(v) openVoucherDialog(c,p.period,v,p.complete?'complete':'waiting',p.complete?'已归档':'已交付');
  return;
 }
 if(action==='query-submit') return runQuery();
 if(action==='clear-archive-search') return searchArchive(true);
});
document.addEventListener('input',event=>{
 const el=event.target;
 if(el.id==='companySearch'){state.search=el.value;renderCompanies();}
 if(el.id==='confirmationNote'){runtime(currentCompany()).draftNotes[el.dataset.task]=el.value;persist();}
 if(el.id==='objectQuery') state.query=el.value;
 if(el.id==='archiveStartDate' || el.id==='archiveEndDate') {$('archiveStartDate').setCustomValidity('');$('archiveSearchError').hidden=true;}
});
document.addEventListener('change',event=>{
 if(event.target.id==='archivePeriod'){state.historyPeriod=event.target.value;renderMain();}
 if(event.target.id==='auxConfirmed'){
  const c=currentCompany(),r=runtime(c);r.auxConfirmed=event.target.checked;persist();
  const review=document.querySelector('[data-action="review"]');if(review) review.disabled=!event.target.checked;
 }
});
document.addEventListener('submit',event=>{if(event.target.id==='tagForm'){event.preventDefault();addTag();}if(event.target.id==='queryForm'){event.preventDefault();runQuery();}if(event.target.id==='archiveSearchForm'){event.preventDefault();searchArchive();}});
document.addEventListener('keydown',event=>{
 if(!$('sidebar').classList.contains('open') || $('dialog').open) return;
 if(event.key==='Escape'){event.preventDefault();closeMenu();}
 if(event.key==='Tab'){
  const nodes=[...$('sidebar').querySelectorAll('button,input,summary')].filter(el=>el.getClientRects().length);
  const first=nodes[0],last=nodes[nodes.length-1];
  if(event.shiftKey && document.activeElement===first){event.preventDefault();last.focus();}
  else if(!event.shiftKey && document.activeElement===last){event.preventDefault();first.focus();}
 }
});
window.addEventListener('resize',()=>{if(window.innerWidth>960) closeMenu(false);});
runtime(currentCompany()).view.stage=null;
render();
persist();
</script>
</body>
</html>
