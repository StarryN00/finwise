services:
  finwise:
    image: finwise-server:20261008-settlements
    env_file:
      - /etc/finwise/production.env
    environment:
      FINWISE_DATABASE_PATH: /var/lib/finwise/finwise.db
      FINWISE_STORAGE_PATH: /var/lib/finwise/artifacts
      FINWISE_REQUIRE_AUTH: "true"
      FINWISE_ENVIRONMENT: production
      FINWISE_AGENT_MODE: disabled
      FINWISE_AGENT_LOOP_ENABLED: "false"
      FINWISE_MONTHLY_AGENT_ENABLED: "false"
      FINWISE_AUTONOMOUS_ENABLED: "true"
      FINWISE_AUTONOMOUS_EXECUTION_MODE: docker
      FINWISE_AUTONOMOUS_CONTAINER_IMAGE: finwise-agent:20261007
      FINWISE_AUTONOMOUS_HOST_RUN_ROOT: ${FINWISE_DATA_ROOT:?Set absolute FINWISE_DATA_ROOT}/autonomous-runs
    network_mode: host
    command: [python, -m, uvicorn, "app.main:app", --host, "127.0.0.1", --port, "8766", --proxy-headers, --forwarded-allow-ips, "127.0.0.1"]
    group_add:
      - "${FINWISE_DOCKER_GID:?Set Docker socket group id}"
    volumes:
      - ${FINWISE_DATA_ROOT:?Set absolute FINWISE_DATA_ROOT}:/var/lib/finwise
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 768m
    pids_limit: 256
    restart: unless-stopped
